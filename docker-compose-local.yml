name: devnodoai-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: local
    image: devnodoai-app:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8080}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CACHE_CONFIG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-devnodoai}
      DB_USERNAME: ${DB_USERNAME:-devnodoai}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      appnet:
        aliases:
          - devnodoai-app
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - appnet

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: ["sh", "-c", "npm install --ignore-scripts; npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
    volumes:
      - ./:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
    networks:
      - appnet

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: local
    image: devnodoai-app:local
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3"]
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-devnodoai}
      DB_USERNAME: ${DB_USERNAME:-devnodoai}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: local
    image: devnodoai-app:local
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-devnodoai}
      DB_USERNAME: ${DB_USERNAME:-devnodoai}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-devnodoai}
      MYSQL_USER: ${DB_USERNAME:-devnodoai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data_local:/var/lib/mysql
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_local:/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  vendor_data:
  mysql_data_local:
  redis_data_local:
  vite_node_modules:
