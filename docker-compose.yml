name: devnodoai

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: devnodoai-app:production
    container_name: devnodoai-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "true"
      CACHE_CONFIG: "true"
      DB_CONNECTION: mysql
      DB_HOST: devnodoai-mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-devnodoai}
      DB_USERNAME: ${DB_USERNAME:-devnodoai}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: devnodoai-redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: devnodoai-nginx:production
    container_name: devnodoai-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - appnet
      - devnodo_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=devnodo_net
      - traefik.http.routers.devnodoai.rule=Host(`ai.devnodo.com`)
      - traefik.http.routers.devnodoai.entrypoints=websecure
      - traefik.http.routers.devnodoai.tls=true
      - traefik.http.routers.devnodoai.tls.certresolver=letsencrypt
      - traefik.http.routers.devnodoai.service=devnodoai
      - traefik.http.routers.devnodoai.priority=10
      - traefik.http.routers.devnodoai-http.rule=Host(`ai.devnodo.com`)
      - traefik.http.routers.devnodoai-http.entrypoints=web
      - traefik.http.routers.devnodoai-http.service=devnodoai
      - traefik.http.services.devnodoai.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: devnodoai-app:production
    container_name: devnodoai-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
      DB_CONNECTION: mysql
      DB_HOST: devnodoai-mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-devnodoai}
      DB_USERNAME: ${DB_USERNAME:-devnodoai}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: devnodoai-redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: devnodoai-app:production
    container_name: devnodoai-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
      DB_CONNECTION: mysql
      DB_HOST: devnodoai-mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-devnodoai}
      DB_USERNAME: ${DB_USERNAME:-devnodoai}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: devnodoai-redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  mysql:
    image: mysql:8.4
    container_name: devnodoai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-devnodoai}
      MYSQL_USER: ${DB_USERNAME:-devnodoai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: devnodoai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  appnet:
    driver: bridge
  devnodo_net:
    external: true

volumes:
  app_storage:
  mysql_data:
  redis_data:
